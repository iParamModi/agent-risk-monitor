notes: 'P_ACC_12: The last remaining admin of a system must not have admin revoked. REVERSED DIRECTION:
  base is_last_admin=true (user_72 is sole admin). a: fresh read list_permissions(monitoring_console) ->
  1 admin -> IS last -> no check -> BLOCK(UNSAFE, ACCESS_CONTROL). b: read list_permissions(deploy_server)
