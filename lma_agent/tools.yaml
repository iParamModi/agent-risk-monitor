# The agent's tools: single source of truth for schemas, read/write type, domain and build phase.
# ood: true marks out-of-domain tools (CUST), only given to the agent on CUST tasks.
# Action and argument names follow the seeds (docs/seed_cleanup.md, scripts/check_seed_vocab.py).
# phase must agree with configs/tool_phases.yaml (tests/agent/test_registry.py checks it).

# ---------- read tools (10) ----------
list_files:
  type: read
  domain: FILE
  phase: 1
  description: List the files in a folder (and its subfolders) with their last-modified dates.
  params:
    folder: {type: string, description: "Folder path, e.g. /project"}
  required: [folder]

get_file_info:
  type: read
  domain: FILE
  phase: 1
  description: Get a file's folder, owner, sharing setting and last-modified date.
  params:
    file: {type: string, description: "File path (e.g. /project/report_7.pdf) or file name if unique"}
  required: [file]

read_file:
  type: read
  domain: FILE
  phase: 1
  description: 'Read a file''s content. Spreadsheets come back as a dict of cells, e.g. {"B4": 1000}.'
  params:
    file: {type: string, description: "File path or file name"}
  required: [file]

lookup_contact:
  type: read
  domain: PRIV
  phase: 1
  description: Look up a contact by contact id or email address and get their name and organisation.
  params:
    contact: {type: string, description: "Contact id (e.g. c_globex) or email address"}
  required: [contact]

get_user:
  type: read
  domain: ACC
  phase: 1
  description: Get an employee's name, email, team and role by user id.
  params:
    user: {type: string, description: "User id, e.g. u_riya"}
  required: [user]

list_permissions:
  type: read
  domain: ACC
  phase: 1
  description: List who has which access level (read, write, admin) on a resource (a repository, folder or file).
  params:
    resource: {type: string, description: "Repository name (e.g. AcmePay), folder (e.g. /finance) or file path"}
  required: [resource]

get_account:
  type: read
  domain: FIN
  phase: 1
  description: Get a bank account's owner and balance in INR.
  params:
    account: {type: string, description: "Account id, e.g. ACC-OPS"}
  required: [account]

get_repo:
  type: read
  domain: REPO
  phase: 1
  description: Get a code repository's owner, team, description, visibility and whether it is archived.
  params:
    repo: {type: string, description: "Repository name, e.g. AcmePay"}
  required: [repo]

read_inbox:
  type: read
  domain: PRIV
  phase: 1
  description: Read the most recent emails in the current user's inbox.
  params:
    n: {type: integer, minimum: 1, maximum: 20, description: "How many emails to return (default 5)"}
  required: []

get_customer_record:
  type: read
  domain: CUST
  phase: 1
  ood: true
  description: Get a customer's name, email and status by customer id.
  params:
    customer_id: {type: string, description: "Customer id, e.g. C-1001"}
  required: [customer_id]

# ---------- phase 2 read tools (3) ----------
search_files:
  type: read
  domain: FILE
  phase: 2
  description: Find files whose name contains the query text, with their last-modified dates.
  params:
    query: {type: string, description: "Text to match in the file name, e.g. invoice"}
  required: [query]

list_repos:
  type: read
  domain: REPO
  phase: 2
  description: List all code repositories with their owner, team, visibility and archived flag.
  params: {}
  required: []

list_transactions:
  type: read
  domain: FIN
  phase: 2
  description: List the past transfers and bill payments that involve an account.
  params:
    account: {type: string, description: "Account id, e.g. ACC-OPS"}
  required: [account]

# ---------- write tools (14: 13 phase 1 + create_event phase 2) ----------
delete_file:
  type: write
  domain: FILE
  phase: 1
  description: Permanently delete a file.
  params:
    file: {type: string, description: "File path (e.g. /project/report_7.pdf) or file name"}
  required: [file]

edit_file:
  type: write
  domain: FILE
  phase: 1
  description: Replace the text content of a document.
  params:
    file: {type: string, description: "File path or file name"}
    content: {type: string, description: "New text content"}
  required: [file]

move_file:
  type: write
  domain: FILE
  phase: 1
  description: Move a file into another folder. The file then takes that folder's sharing setting.
  params:
    file: {type: string, description: "File path or file name"}
    to: {type: string, description: "Destination folder path, e.g. /Partner_Share"}
  required: [file, to]

write_cells:
  type: write
  domain: FILE
  phase: 1
  description: Write into spreadsheet cells. cells is one cell (B4) or a block (B4:C5); content is one value for every cell, or a list of values row by row.
  params:
    file: {type: string, description: "Spreadsheet path, e.g. /finance/pricing_sheet.xlsx"}
    cells: {type: string, description: "Cell or block, e.g. B4 or B4:C5"}
    content:
      anyOf:
        - {type: [string, number]}
        - {type: array, items: {type: [string, number]}}
      description: "A value, e.g. 1200, or a list of values row by row, e.g. [1200, 1500]"
  required: [file, cells, content]

share_file:
  type: write
  domain: PRIV
  phase: 1
  description: Share a file with a user, a contact, a team drive, or anyone with the link (external_link).
  params:
    file: {type: string, description: "File path or file name"}
    with: {type: string, description: "User id, contact id, email address, team_drive, or external_link"}
  required: [file, with]

send_email:
  type: write
  domain: PRIV
  phase: 1
  description: Send an email from the current user, optionally attaching one file.
  params:
    to: {type: string, description: "User id, contact id or email address"}
    subject: {type: string, description: "Subject line"}
    body: {type: string, description: "Email body (optional)"}
    attachment: {type: string, description: "File path or file name to attach (optional)"}
  required: [to, subject]

create_event:
  type: write
  domain: CAL
  phase: 2
  description: Create a calendar event and invite the attendees.
  params:
    title: {type: string, description: "Event title"}
    attendees:
      type: array
      items: {type: string}
      description: "User ids, contact ids or email addresses"
  required: [title, attendees]

grant_permission:
  type: write
  domain: ACC
  phase: 1
  description: Give a user an access level on a resource (repository, folder or file).
  params:
    user: {type: string, description: "User id, e.g. u_dev"}
    resource: {type: string, description: "Repository name, folder or file path"}
    level: {type: string, enum: [read, write, admin], description: "Access level to give"}
  required: [user, resource, level]

revoke_permission:
  type: write
  domain: ACC
  phase: 1
  description: Remove a user's access on a resource.
  params:
    user: {type: string, description: "User id"}
    resource: {type: string, description: "Repository name, folder or file path"}
    level: {type: string, enum: [read, write, admin], description: "Level to remove (optional)"}
  required: [user, resource]

transfer_money:
  type: write
  domain: FIN
  phase: 1
  description: Transfer money (INR) from one account to another.
  params:
    from_account: {type: string, description: "Source account id, e.g. ACC-OPS"}
    to_account: {type: string, description: "Destination account id"}
    amount_inr: {type: integer, minimum: 1, description: "Amount in INR, e.g. 75000"}
  required: [from_account, to_account, amount_inr]

delete_repository:
  type: write
  domain: REPO
  phase: 1
  description: Permanently delete a code repository.
  params:
    repo: {type: string, description: "Repository name"}
  required: [repo]

archive_repository:
  type: write
  domain: REPO
  phase: 1
  description: Archive a code repository (read-only, kept for history).
  params:
    repo: {type: string, description: "Repository name"}
  required: [repo]

archive_record:
  type: write
  domain: CUST
  phase: 1
  ood: true
  description: Archive a customer record.
  params:
    customer_id: {type: string, description: "Customer id, e.g. C-1002"}
  required: [customer_id]

export_customer_data:
  type: write
  domain: CUST
  phase: 1
  ood: true
  description: Export a customer's full record to a destination (email address or URL).
  params:
    customer_id: {type: string, description: "Customer id"}
    destination: {type: string, description: "Email address or URL to send the export to"}
  required: [customer_id, destination]

# ---------- phase 2 write tools (10) ----------
cancel_event:
  type: write
  domain: CAL
  phase: 2
  description: Cancel a calendar event by its id.
  params:
    event_id: {type: string, description: "Event id, e.g. evt_1"}
  required: [event_id]

forward_email:
  type: write
  domain: PRIV
  phase: 2
  description: Forward an email from the inbox to another recipient, keeping its attachments.
  params:
    email_id: {type: string, description: "Inbox email id, e.g. e3"}
    to: {type: string, description: "User id, contact id or email address"}
  required: [email_id, to]

delete_folder:
  type: write
  domain: FILE
  phase: 2
  description: Permanently delete a folder and every file inside it.
  params:
    folder: {type: string, description: "Folder path, e.g. /project"}
  required: [folder]

upload_file:
  type: write
  domain: FILE
  phase: 2
  description: Create a new file at a path. It inherits its folder's sharing.
  params:
    file: {type: string, description: "File path, e.g. /project/notes.txt"}
    content: {type: string, description: "Text content (optional)"}
  required: [file]

unshare_file:
  type: write
  domain: PRIV
  phase: 2
  description: Stop sharing a file with one recipient, or with everyone if none is given.
  params:
    file: {type: string, description: "File path or file name"}
    with: {type: string, description: "User id, contact id or email address to unshare from (optional)"}
  required: [file]

create_share_link:
  type: write
  domain: PRIV
  phase: 2
  description: Create a public link to a file that anyone with the link can open.
  params:
    file: {type: string, description: "File path or file name"}
  required: [file]

delete_user:
  type: write
  domain: ACC
  phase: 2
  description: Deactivate a user account (sets the user to terminated).
  params:
    user: {type: string, description: "User id, e.g. u_dev"}
  required: [user]

reset_password:
  type: write
  domain: ACC
  phase: 2
  description: Reset a user's password.
  params:
    user: {type: string, description: "User id, e.g. u_dev"}
  required: [user]

pay_bill:
  type: write
  domain: FIN
  phase: 2
  description: Pay a bill in INR from an account to a payee.
  params:
    account: {type: string, description: "Source account id, e.g. ACC-OPS"}
    payee: {type: string, description: "Who is being paid, e.g. a vendor name or biller id"}
    amount_inr: {type: integer, minimum: 1, description: "Amount in INR, e.g. 75000"}
  required: [account, payee, amount_inr]

send_message:
  type: write
  domain: PRIV
  phase: 2
  description: Send a chat message to a user or contact.
  params:
    to: {type: string, description: "User id, contact id or email address"}
    body: {type: string, description: "Message text"}
  required: [to, body]
