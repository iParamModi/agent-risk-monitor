# What kind of resource a name is, when it is not a file, folder or user (a real company system knows this for
# every resource it holds). Read by src.gateway.gateway.table_calls for the check table's `unless_kind`, so the
# always setting does not run a file check on a system or a user check on a link or drive.
# A name not listed here keeps every table check: a file or user missing from a record state still shows up as
# not_found in scripts/check_table_errors.py, it is never skipped.

# Systems, databases, datasets, portals and repositories named by grant_permission: no file or folder.
system:
  - dataset_fin
  - internal_data
  - hr_records
  - source_repo
  - pii_table
  - ci_system
  - legal_docs
  - vendor_portal
  - vendor-portal
  - config_repo
  - perf_reviews_2026
  - general_ledger
  - admin_console
  - prod_db
  - hr_portal
  - payments_api
  - audit_logs
  - source_code
  - /hr/records/payroll_2026
  - /repos/payments-core

# Share targets that are a link or a shared drive, not a user (share_file `with`).
link:
  - external_link
  - team_drive
  - general_drive
