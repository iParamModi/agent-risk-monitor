<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Labs Workspace</title>
<style>
/* Northwind Labs is a fictional company. Everything this page shows comes from the run log events and the
   /api/runs/{source}/{id}/state endpoint: no decision, check result or fact is written into this file. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f9fafb; --ink: #1c2230; --muted: #5d6576; --faint: #8a91a0;
  --line: #dde1e8; --soft: #eef1f5; --accent: #2f5bd3;
  --red: #c62f3a; --red-bg: #fde8ea; --amber: #a85d00; --amber-bg: #fff1dc; --green: #1d7f46; --green-bg: #e3f5ea;
  --violet: #6a3fb5; --violet-bg: #efe7fb; --fake: #8a5a00; --fake-bg: #fff4d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1217; --panel: #161a21; --panel2: #1b2029; --ink: #e4e8ef; --muted: #98a1b2; --faint: #6c7486;
  --line: #2a303b; --soft: #212732; --accent: #7ea2ff;
  --red: #ff7a84; --red-bg: #3a1d22; --amber: #ffb259; --amber-bg: #3a2a14; --green: #5fd394; --green-bg: #173225;
  --violet: #c3a3ff; --violet-bg: #2a2140; --fake: #ffcf5c; --fake-bg: #3a2f12;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
pre { background: var(--soft); border-radius: 6px; padding: 8px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
button { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] button[aria-pressed="true"] { color: #0f1217; }
select { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.fake { color: var(--fake); background: var(--fake-bg); border-color: var(--fake); }
.chip.reuse { color: var(--violet); border-color: var(--violet); }
.dec { font-family: var(--mono); font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 5px; white-space: nowrap; }
.dec.BLOCK { color: var(--red); background: var(--red-bg); }
.dec.ASK_CONFIRMATION { color: var(--amber); background: var(--amber-bg); }
.dec.ALLOW { color: var(--green); background: var(--green-bg); }
.dec.ESCALATE { color: var(--violet); background: var(--violet-bg); }
.dec.big { font-size: 16px; padding: 3px 10px; }

/* three columns + status bar */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(420px, 36%) minmax(0, 1fr) minmax(330px, 25%); }
.col { min-height: 0; min-width: 0; overflow: auto; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.sect { font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 16px 14px 6px; display: flex; align-items: center; gap: 8px; }
.sect::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

/* left: company apps */
.apps { background: var(--panel); }
.brand { display: flex; gap: 10px; align-items: center; padding: 14px 14px 4px; }
.logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 15px var(--mono); color: var(--bg); background: var(--amber); }
.brand b { display: block; }
.appnav { display: flex; flex-direction: column; padding: 0 8px; }
.appnav button, .appnav a { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
.appnav button:hover, .appnav a:hover { background: var(--soft); }
.appnav button[aria-current="true"] { background: var(--soft); box-shadow: inset 2px 0 0 var(--amber); }
.appnav .n { font: 12px var(--mono); color: var(--faint); }
.appnav .n.hot { color: var(--amber); }
.mvbar { display: flex; align-items: center; gap: 8px; margin: 10px 14px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
.mvbar label { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
.mvbar.on { border-color: var(--amber); }
.appview { padding: 4px 14px 8px; }
.appview h4 { margin: 14px 0 6px; font-size: 12.5px; color: var(--muted); font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.t { width: 100%; border-collapse: collapse; font: 11.5px/1.35 var(--mono); }
table.t th { text-align: left; font: 600 10.5px var(--mono); color: var(--faint); padding: 5px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel2); position: sticky; top: 0; }
table.t td { padding: 4px 5px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.grp td { color: var(--muted); background: var(--panel2); font-weight: 600; }
table.t tr.removed td { text-decoration: line-through; color: var(--faint); }
table.t tr.removed td.why { text-decoration: none; }
table.t tr.focus td { background: color-mix(in srgb, var(--accent) 16%, transparent); }
table.t tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.t tr.flash td { animation: flash 2.4s ease-out 1; }
@keyframes flash { 0%, 30% { background: var(--amber-bg); } 100% { background: transparent; } }
.htag { font: 700 9px var(--mono); color: var(--bg); background: var(--amber); border-radius: 3px; padding: 0 3px; margin-left: 3px; vertical-align: 1px; cursor: help; }
td.hid { text-decoration: underline dotted var(--amber); text-underline-offset: 3px; }
td.unseen { opacity: .22; filter: grayscale(1); }
td.seen { color: var(--ink); }
td.revealed { outline: 1px solid var(--amber); outline-offset: -2px; background: var(--amber-bg); }
.y { color: var(--red); } .n0 { color: var(--muted); }
.why { color: var(--red); font-size: 11px; }
.empty { color: var(--muted); padding: 10px 2px; font-size: 13px; }

/* centre: agent chat */
.chat { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.chathead { padding: 10px 16px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
.taskline { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.taskline h2 { font-size: 15px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.pickrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; font-size: 12.5px; }
.pickrow .lbl { color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.controls .pos { margin-left: auto; font: 12px var(--mono); color: var(--muted); }
.banner { margin: 10px 16px 0; border: 1px solid var(--fake); background: var(--fake-bg); color: var(--fake); border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 13px; }
.msgs { flex: 1; overflow: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.msg .who { font: 600 11px var(--mono); color: var(--faint); margin-bottom: 2px; }
.msg.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.msg.agent { align-self: flex-start; }
.note { align-self: center; font-size: 12px; color: var(--violet); border: 1px dashed var(--violet); border-radius: 8px; padding: 4px 10px; max-width: 90%; text-align: center; }
.tool { align-self: flex-start; max-width: 92%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font: 12.5px var(--mono); }
.tool summary { list-style: none; cursor: pointer; padding: 5px 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tool summary::-webkit-details-marker { display: none; }
.tool pre { margin: 0 8px 8px; max-height: 260px; overflow: auto; }
.tag { font: 700 10px var(--mono); letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); text-transform: uppercase; }
.tag.red { color: var(--red); border-color: var(--red); }
.arrow { color: var(--faint); }
.res { color: var(--green); }
.risk { align-self: stretch; border: 1px solid var(--red); border-left-width: 4px; border-radius: 10px; background: var(--red-bg); padding: 9px 12px; cursor: pointer; }
.risk.sel { box-shadow: 0 0 0 2px var(--red); }
.risk .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.risk code { font-size: 13.5px; font-weight: 600; }
.risk .st { margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 600 12.5px var(--mono); }
.st .pause { color: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
.st .wait { color: var(--amber); }
.st .ok { color: var(--green); }
.st .bad { color: var(--red); }
@keyframes pulse { 50% { opacity: .45; } }
.diff { align-self: flex-start; font: 12px var(--mono); color: var(--amber); border-left: 2px solid var(--amber); padding: 2px 8px; cursor: pointer; }
.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.presets button { border-radius: 999px; font-size: 12.5px; padding: 3px 11px; }
.taskform { display: flex; gap: 8px; }
.taskform input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.taskform input:disabled { color: var(--muted); }

/* right: safety monitor */
.monitor { background: var(--panel); padding: 0 0 20px; }
.mhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; flex-wrap: wrap; }
.mhead h3 { margin: 0; font: 700 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.blk { margin: 10px 14px 0; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--panel2); }
.blk h5 { margin: 0 0 5px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.blk h5 .lat { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; font: 12.5px var(--mono); margin-top: 4px; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.ans { font: 600 13px var(--mono); }
.ans .no { color: var(--amber); } .ans .yes { color: var(--green); }
.chk { border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 6px; }
.chk:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.chk pre { font-size: 11.5px; margin-top: 4px; }
.chk code, .blk .ans code, .blk .small code { overflow-wrap: anywhere; }
.chk .rv { display: block; color: var(--green); font: 12px var(--mono); overflow-wrap: anywhere; margin-top: 2px; }
.chk details > summary { font-size: 11.5px; }
.revtag { font: 600 10px var(--mono); color: var(--amber); }
ol.pol { margin: 4px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
ol.pol li { padding: 2px 0; color: var(--muted); }
ol.pol li code { color: var(--ink); margin-right: 6px; }
ol.pol li.cited { color: var(--ink); font-weight: 600; }
ol.pol li.cited code { color: var(--amber); }
details > summary { cursor: pointer; }
.blk details > summary { color: var(--muted); font-size: 12.5px; }
.decision { border-width: 1px; border-left-width: 4px; }
.decision.BLOCK { border-color: var(--red); } .decision.ASK_CONFIRMATION { border-color: var(--amber); }
.decision.ALLOW { border-color: var(--green); } .decision.ESCALATE { border-color: var(--violet); }
.counter { display: flex; gap: 14px; flex-wrap: wrap; margin: 10px 14px 0; font: 12.5px var(--mono); color: var(--muted); }
.counter b { color: var(--ink); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.confirm button { font-weight: 600; }
.confirm button.chosen { opacity: 1; border-width: 2px; }
.confirm button.approve.chosen { border-color: var(--green); color: var(--green); background: var(--green-bg); }
.confirm button.deny.chosen { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.waiting { color: var(--amber); font: 600 12.5px var(--mono); animation: pulse 1.4s ease-in-out infinite; }
.mempty { margin: 16px 14px; color: var(--muted); font-size: 13px; }

/* pages (audit log, compare, results, how it works): the sidebar keeps the navigation, the page takes the rest */
.ws.paged { grid-template-columns: minmax(230px, 18%) minmax(0, 1fr); }
.ws.paged .chat, .ws.paged .monitor, .ws.paged #mvbar, .ws.paged #appview { display: none; }
.page { background: var(--bg); padding: 0 24px 30px; border-right: 0; }
.page[hidden] { display: none; }
.page h2 { font-size: 19px; margin: 18px 0 4px; }
.page .lede { color: var(--muted); max-width: 96ch; margin: 0 0 10px; }
.page h3.sub { font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
.page h3.sub .small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.page a { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 10px 0; }
.toolbar input[type="search"] { font: inherit; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; min-width: 200px; }
.toolbar .lbl { color: var(--faint); font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.toolbar .pill { border-radius: 999px; font-size: 12.5px; padding: 3px 11px; }
table.t.wide td { white-space: normal; }
table.t.wide td:not(.sum) { white-space: nowrap; }
table.t.wide tbody tr[tabindex] { cursor: pointer; }
table.t.wide tbody tr[tabindex]:hover td { background: var(--soft); }
table.t td.notread { color: var(--faint); font-style: italic; }
table.t.nums td { font-variant-numeric: tabular-nums; }
table.t.nums tr.ours td { background: var(--amber-bg); font-weight: 600; }
table.t td.ok, .ok { color: var(--green); } table.t td.bad, .bad { color: var(--red); }
.tag.actor-user { color: var(--accent); border-color: var(--accent); } .tag.actor-monitor { color: var(--violet); border-color: var(--violet); }
.tag.actor-gateway { color: var(--green); border-color: var(--green); } .tag.actor-company { color: var(--amber); border-color: var(--amber); }
.drawer { position: fixed; top: 0; right: 0; bottom: 31px; width: min(520px, 94vw); background: var(--panel); border-left: 1px solid var(--line);
  box-shadow: -12px 0 28px rgba(0, 0, 0, .28); overflow: auto; padding: 14px 16px; z-index: 5; }
.drawer[hidden] { display: none; }
.drawer .dhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-family: var(--mono); }
.taskbox { margin: 0 0 12px; display: grid; gap: 5px; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.side { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; min-width: 0; }
.side .shead { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.side h3 { margin: 0; font: 700 14px var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.side .kv { margin: 10px 0; row-gap: 4px; }
.verdict { margin: 14px 0 0; font-size: 14.5px; }
.more { margin-top: 18px; } .more > summary { color: var(--muted); margin-bottom: 8px; }
.arch { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; margin: 14px 0 6px; }
.node { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.node span { color: var(--muted); font-size: 12.5px; } .node code { color: var(--faint); font-size: 11.5px; overflow-wrap: anywhere; }
.node.gate { border-color: var(--red); } .node.mon { border-color: var(--violet); } .node.gw { border-color: var(--green); }
.arrow { align-self: center; color: var(--faint); font: 18px var(--mono); }
.steps { color: var(--muted); max-width: 100ch; margin: 10px 0 0; padding-left: 20px; } .steps li { margin: 3px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 12px 14px; }
.card p { margin: 8px 0 0; } .card ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; } .card li { margin: 3px 0; }

/* status bar */
.status { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--panel); font: 12px var(--mono); color: var(--muted); }
.status .mode { font-weight: 700; color: var(--amber); border: 1px solid var(--amber); border-radius: 4px; padding: 0 6px; letter-spacing: .08em; }
.status .sep { color: var(--line); }
.status b { color: var(--ink); font-weight: 600; }
.status .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.status button { font-size: 11.5px; padding: 1px 8px; }

@media (max-width: 1100px) {
  body { display: block; height: auto; }
  .ws { display: flex; flex-direction: column; }
  .col { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
  .chat { order: 1; overflow: visible; } .monitor { order: 2; } .apps { order: 3; }
  .msgs { overflow: visible; }
  .status { position: sticky; bottom: 0; }
  .msg { max-width: 92%; }
  .ws.paged { display: flex; }
  .page { order: 1; padding: 0 16px 24px; }
  .ws.paged .apps { order: 2; }
  .cmp { grid-template-columns: 1fr; }
  .arrow { display: none; }
}
</style>
</head>
<body>
<div class="ws">
  <aside class="col apps" aria-label="Company apps">
    <div class="brand"><div class="logo" aria-hidden="true">N</div>
      <div><b>Northwind Labs</b><span class="muted small">fictional company · internal workspace</span></div></div>
    <div class="sect">Company apps</div>
    <nav class="appnav" id="appnav"></nav>
    <div class="mvbar" id="mvbar">
      <label><input type="checkbox" id="mv"> Monitor view</label>
      <span class="muted small" id="mvnote">grey = facts the monitor has not seen</span>
    </div>
    <div class="appview" id="appview"><p class="empty">Loading the company...</p></div>
    <div class="sect">Monitor</div>
    <nav class="appnav" id="pagenav"></nav>
  </aside>

  <section class="col chat" aria-label="Agent">
    <div class="chathead">
      <div class="taskline"><h2 id="tasktitle">Agent</h2><span class="muted small" id="taskdesc"></span></div>
      <div class="pickrow" id="picker"></div>
      <div class="controls">
        <button type="button" id="b-reset">Restart</button>
        <button type="button" id="b-prev" aria-label="Previous event">Back</button>
        <button type="button" id="b-play">Play</button>
        <button type="button" id="b-next" aria-label="Next event">Next</button>
        <button type="button" id="b-all">Show all</button>
        <select id="speed" aria-label="Replay speed"><option value="1800">slow</option><option value="1000" selected>normal</option><option value="450">fast</option></select>
        <span class="pos" id="pos"></span>
      </div>
    </div>
    <div id="banner"></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composer">
      <div class="presets" id="presets"></div>
      <form class="taskform" id="taskform">
        <input id="taskinput" disabled aria-label="Task for the agent" placeholder="Loading...">
        <button type="submit" id="runbtn">Replay</button>
      </form>
    </div>
  </section>

  <aside class="col monitor" id="monitor" aria-label="Safety monitor"></aside>
  <section class="col page" id="page" hidden></section>
</div>
<footer class="status" id="status"></footer>

<script>
"use strict";
const DEC = { BLOCK: "BLOCK", ASK_CONFIRMATION: "ASK CONFIRMATION", ALLOW: "ALLOW", ESCALATE: "ESCALATE" };
// Which collections each app shows. Columns name state fields; nothing here is a value from a run.
const APPS = [
  { id: "files", name: "Files", sections: [{ coll: "files", title: "Files by folder", folders: true,
      cols: [["path", "name", v => v.split("/").pop()], ["owner", "owner"], ["sharing", "sharing"], ["classification", "class"], ["modified", "modified"]] }] },

// ---------- stepping ----------
function show(n, { follow = true } = {}) {
  const prev = S.shown, total = S.events.length;
  S.shown = Math.max(1, Math.min(total, n));
  if (follow && S.shown > prev) {
    const e = S.events[S.shown - 1];
    if (e.type === "risk_action") { S.selRisk = null; const t = targetOf(e.payload.args); if (t) { S.focus = { coll: t.coll, key: t.key }; S.app = APP_OF[t.coll] || S.app; } }
    if (e.type === "state_diff" && e.payload.changed) { const c = e.payload.changes.find(x => APP_OF[x.collection] === S.app) || e.payload.changes[0]; S.focus = { coll: c.collection, key: c.key }; S.app = APP_OF[c.collection] || S.app; }
  }
  renderAll();
  $("pos").textContent = `event ${S.shown} of ${total}`;
  $("b-prev").disabled = S.shown <= 1;
  $("b-next").disabled = S.shown >= total;
  if (S.run) history.replaceState(null, "", location.pathname + location.search + "#" + encodeURIComponent(`${S.run.source}/${S.run.run_id}/${S.shown}`).replace(/%2F/g, "/"));
  const f = document.querySelector("#appview tr.focus");
  if (f && follow) f.scrollIntoView({ block: "nearest" });
  if (S.shown >= total) stop();
}
function stop() { if (S.timer) clearInterval(S.timer); S.timer = null; $("b-play").textContent = "Play"; }
function toggle() {
  if (S.timer) { stop(); return; }
  if (S.shown >= S.events.length) show(1, { follow: false });

}
function flipTheme() {
  const root = document.documentElement;

  try { localStorage.setItem("nw-theme", root.dataset.theme); } catch (e) { /* storage off: theme resets on reload */ }
}

$("b-reset").onclick = () => { stop(); show(S.events.findIndex(e => e.type === "instruction") + 1 || 1, { follow: false }); };

  else if (e.key === " " && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); toggle(); }
});
